name: Preview

# Every pull request gets its own Firebase Hosting preview URL, posted back as a
# comment on the PR and expiring after 7 days. Deploying to a preview channel
# cannot touch the live site — that is the whole point: look at a wording change
# on the real hosting stack before it is the thing pivotdevshop.com serves.
on:
  pull_request:
    paths:
      - 'public/**'
      - 'menu/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/preview.yml'

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # A pull request from a fork gets no secrets, so the deploy would fail on the
    # missing key rather than on anything about the change.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write the service account key
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # menu.pivotdevshop.com is a second hosting site in the same project. A deploy
      # to a site that doesn't exist fails, so create it the first time; every run
      # after that finds it and does nothing.
      - name: Make sure the menu site exists
        run: |
          npx --yes firebase-tools@latest hosting:sites:get pivot-dev-shop-menu --project pivot-dev-shop --non-interactive \
            || npx --yes firebase-tools@latest hosting:sites:create pivot-dev-shop-menu --project pivot-dev-shop --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pivot-dev-shop
          expires: 7d
